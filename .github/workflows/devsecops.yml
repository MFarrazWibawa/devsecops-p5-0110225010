name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (Quality Gate - coverage >= 80%)
        run: python -m pytest -v --cov=taskmanager --cov-report=term-missing --cov-fail-under=80

  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.7.10

      - name: Run Bandit (generate report)
        run: bandit -r taskmanager main.py -c bandit.yaml -f json -o bandit-report.json --exit-zero

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Quality Gate - fail on MEDIUM or HIGH severity findings
        run: bandit -r taskmanager main.py -c bandit.yaml --severity-level medium --confidence-level medium